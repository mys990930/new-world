# Block asset manifest
# - `tile_size` is the required width/height for every block texture PNG.
# - texture paths are resolved relative to this file.
# - layer 0 is reserved for the built-in white texture used by debug cubes and tint-only draws.

tile_size = 16

[[textures]]
key = "grass_top"
path = "textures/grass_top.png"

[[textures]]
key = "grass_side"
path = "textures/grass_side.png"

[[textures]]
key = "dirt"
path = "textures/dirt.png"

[[textures]]
key = "stone"
path = "textures/stone.png"

[[blocks]]
id = 0
key = "air"
solid = false
opaque = false
render = "empty"

[[blocks]]
id = 1
key = "grass"
solid = true
opaque = true
render = "cube"
top = "grass_top"
bottom = "dirt"
side = "grass_side"

[[blocks]]
id = 2
key = "dirt"
solid = true
opaque = true
render = "cube"
top = "dirt"
bottom = "dirt"
side = "dirt"

[[blocks]]
id = 3
key = "stone"
solid = true
opaque = true
render = "cube"
top = "stone"
bottom = "stone"
side = "stone"
