# Block asset index
# - `tile_size` is the required width/height for every block texture PNG.
# - texture paths and block definition paths are resolved relative to this file.
# - layer 0 is reserved for the built-in white texture used by debug cubes and tint-only draws.

tile_size = 16

block_files = [
  "defs/air.toml",
  "defs/grass.toml",
  "defs/dirt.toml",
  "defs/stone.toml",
  "defs/sand.toml",
  "defs/gravel.toml",
  "defs/mud.toml",
  "defs/snow.toml",
  "defs/water.toml",
  "defs/terrain_debug.toml",
  "defs/coarse_dirt.toml",
  "defs/clay.toml",
  "defs/ice.toml",
  "defs/peat.toml",
  "defs/silt.toml",
  "defs/humus.toml",
  "defs/leaf_litter.toml",
  "defs/moss.toml",
  "defs/podzol.toml",
  "defs/thin_soil.toml",
  "defs/red_sand.toml",
  "defs/dry_grass.toml",
  "defs/wet_sand.toml",
  "defs/wet_gravel.toml",
  "defs/exposed_rock.toml",
  "defs/rock.toml",
  "defs/sandstone.toml",
  "defs/scree.toml",
  "defs/alpine_soil.toml",
  "defs/moraine.toml",
  "defs/laterite.toml",
]

