# Block asset index
# - `tile_size` is the required width/height for every block texture PNG.
# - texture paths and block definition paths are resolved relative to this file.
# - layer 0 is reserved for the built-in white texture used by debug cubes and tint-only draws.

tile_size = 16

block_files = [
  "defs/air.toml",
  "defs/grass.toml",
  "defs/dirt.toml",
  "defs/stone.toml",
  "defs/terrain_debug.toml",
  "defs/sand.toml",
  "defs/gravel.toml",
  "defs/mud.toml",
  "defs/snow.toml",
  "defs/water.toml",
]

[[textures]]
key = "grass_top"
path = "textures/grass_top.png"

[[textures]]
key = "grass_side"
path = "textures/grass_side.png"

[[textures]]
key = "dirt"
path = "textures/dirt.png"

[[textures]]
key = "stone"
path = "textures/stone.png"

[[textures]]
key = "sand"
path = "textures/sand.png"

[[textures]]
key = "gravel"
path = "textures/gravel.png"

[[textures]]
key = "mud"
path = "textures/mud.png"

[[textures]]
key = "snow"
path = "textures/snow.png"

[[textures]]
key = "water"
path = "textures/water.png"
